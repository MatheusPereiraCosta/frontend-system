name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agendapro-frontend

jobs:
  # ============================================================================
  # JOB 1: Testes de Qualidade e Build da Aplicação Angular 19
  # ============================================================================
  test-and-build:
    name: 🧪 Test & Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código fonte
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências limpas (npm ci)
        run: npm ci

      - name: 🏗️ Compilar aplicação Angular (Produção)
        run: npm run build -- --configuration production

      - name: 💾 Upload do artefato compilado
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/frontend/browser
          retention-days: 7

  # ============================================================================
  # JOB 2: Build da Imagem Docker e Publicação no GHCR
  # ============================================================================
  docker-build-and-push:
    name: 🐳 Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout do código fonte
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: 🔑 Autenticação no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extrair metadados e tags para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: 🚀 Build e Push da Imagem Docker com Cache GHA
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
