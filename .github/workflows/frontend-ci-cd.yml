name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ '**' ] # Roda build e testes em qualquer branch
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Selecione o ambiente para Deploy (opcional)'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'dsv'
          - 'hml'
          - 'prd'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agendapro-frontend

jobs:
  # ============================================================================
  # 1. TESTES E BUILD EM QUALQUER BRANCH
  # ============================================================================
  test-and-build:
    name: 🧪 Test & Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código fonte
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências limpas
        run: npm ci

      - name: 🏗️ Compilar aplicação Angular (Produção)
        run: npm run build -- --configuration production

      - name: 💾 Upload do artefato compilado
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/frontend/browser
          retention-days: 7

  # ============================================================================
  # 2. BUILD E PUBLICAÇÃO DA IMAGEM DOCKER
  # (Executa na branch 'main' OU quando solicitado via dispatch manual)
  # ============================================================================
  docker-publish:
    name: 🐳 Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment != 'none')

    steps:
      - name: 📥 Checkout do código fonte
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Autenticação no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extrair metadados e tags para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: 🚀 Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. DEPLOY EM DSV (DESENVOLVIMENTO) - AUTOMÁTICO NA MAIN OU DISPATCH
  # ============================================================================
  deploy-dsv:
    name: 🚀 Deploy DSV (Desenvolvimento)
    runs-on: ubuntu-latest
    needs: [docker-publish]
    environment:
      name: development
      url: https://dsv.agendapro.local
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_environment == 'dsv'

    steps:
      - name: 📡 Notificação e execução de deploy em DSV
        run: |
          echo "Iniciando deploy automático no ambiente de DESENVOLVIMENTO (DSV)..."
          echo "Imagem: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Deploy em DSV concluído com sucesso!"

  # ============================================================================
  # 4. DEPLOY EM HML (HOMOLOGAÇÃO) - REQUER APROVAÇÃO MANUAL NO GITHUB
  # ============================================================================
  deploy-hml:
    name: 🛡️ Deploy HML (Homologação - Requer Aprovação)
    runs-on: ubuntu-latest
    needs: [deploy-dsv]
    environment:
      name: homologation
      url: https://hml.agendapro.local
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_environment == 'hml'

    steps:
      - name: 📡 Execução de deploy em HML
        run: |
          echo "Deploy aprovado pelo responsável!"
          echo "Executando deploy no ambiente de HOMOLOGAÇÃO (HML)..."
          echo "Deploy em HML concluído com sucesso!"

  # ============================================================================
  # 5. DEPLOY EM PRD (PRODUÇÃO) - REQUER APROVAÇÃO MANUAL NO GITHUB
  # ============================================================================
  deploy-prd:
    name: 🏆 Deploy PRD (Produção - Requer Aprovação)
    runs-on: ubuntu-latest
    needs: [deploy-hml]
    environment:
      name: production
      url: https://app.agendapro.local
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_environment == 'prd'

    steps:
      - name: 📡 Execução de deploy em PRD
        run: |
          echo "Deploy em PRODUÇÃO aprovado pelo responsável!"
          echo "Executando deploy em PRODUÇÃO (PRD)..."
          echo "Deploy em PRD concluído com sucesso!"
